services:
  mongodb:
    image: mongo:6.0
    container_name: flowwarden-examples-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=flowwarden-examples
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  # Ephemeral one-shot that initialises the replica set as soon as
  # mongodb reports healthy. Required because change streams only work
  # on a replica set (or sharded cluster).
  mongo-init:
    image: mongo:6.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongodb:27017 --eval '
        try {
          rs.status();
          print("Replica set already initialized");
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "localhost:27017" }]
          });
          print("Replica set initiated");
        }
      '
