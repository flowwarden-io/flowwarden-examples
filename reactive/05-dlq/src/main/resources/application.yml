server:
  port: 0

spring:
  application:
    name: example-reactive-05-dlq
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: reactive

examples:
  data-generator:
    enabled: true
    mode: reactive
    collection: orders-dlq
    rates:
      inserts-per-second: 3
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
