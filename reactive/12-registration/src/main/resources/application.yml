server:
  port: 0

spring:
  application:
    name: example-reactive-12-registration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: reactive

examples:
  # The stream catalog. No @ChangeStream class exists in this module:
  # YamlStreamContributor turns each entry into a StreamSpec at bootstrap.
  registration:
    streams:
      - name: confirmed-orders
        collection: orders-registration
        inserts-only: true        # -> .pipeline($match operationType=insert)
        keep-status: CONFIRMED    # -> .filter(status == CONFIRMED)
        dlq: true                 # -> .deadLetterQueue(defaults)
  data-generator:
    enabled: true
    mode: reactive
    collection: orders-registration
    rates:
      inserts-per-second: 4
      updates-per-second: 1
      deletes-per-second: 0
      replaces-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
