server:
  port: 0

spring:
  application:
    name: example-reactive-10-transactions
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: reactive

examples:
  data-generator:
    enabled: false
  transactions:
    generator:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
