server:
  port: 0

spring:
  application:
    name: example-reactive-09-full-stack
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: reactive

examples:
  data-generator:
    enabled: true
    mode: reactive
    collection: orders-full
    # Deletes off — see FullStackHandler Javadoc.
    rates:
      inserts-per-second: 5
      updates-per-second: 2
      deletes-per-second: 0
      replaces-per-second: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
