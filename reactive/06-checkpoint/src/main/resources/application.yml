server:
  port: 0

spring:
  application:
    name: example-reactive-06-checkpoint
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: reactive

examples:
  data-generator:
    enabled: true
    mode: reactive
    collection: orders-checkpoint
    rates:
      inserts-per-second: 2
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0
    pool:
      refresh-strategy: QUERY_EACH_TICK

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
