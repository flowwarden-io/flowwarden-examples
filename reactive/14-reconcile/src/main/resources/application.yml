server:
  port: 0

spring:
  application:
    name: example-reactive-14-reconcile
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: reactive

examples:
  data-generator:
    enabled: true
    mode: reactive
    collection: orders-reconcile
    rates:
      inserts-per-second: 2
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0
  reconcile-demo:
    # Every interval the stream is stopped, left down for `downtime-ms`
    # (the generator keeps inserting meanwhile), its persisted positions are
    # replaced by an expired token, and it is started again: the next start
    # reaches cascade level 3 and calls the @Reconcile hook.
    initial-delay-ms: 15000
    downtime-ms: 3000
    interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
    io.flowwarden.stream.internal.checkpoint.ResumeCascade: INFO
