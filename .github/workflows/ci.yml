name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Read access to stream-core SNAPSHOTs on GitHub Packages (Maven
          # requires authentication even for public packages).
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw -B verify
