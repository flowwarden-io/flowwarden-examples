server:
  port: 0

spring:
  application:
    name: example-imperative-08-filter
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-filter
    # The generator picks status uniformly from {PENDING, CONFIRMED,
    # CANCELLED}, so ~1/3 of inserts pass FilterHandler#keepConfirmedOnly
    # and reach @OnInsert. The other ~2/3 still cross the wire — that's
    # the point of comparison with @Pipeline (07).
    rates:
      inserts-per-second: 4
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
