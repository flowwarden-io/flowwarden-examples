server:
  port: 0

spring:
  application:
    name: example-imperative-02-typed-handlers
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-typed
    rates:
      inserts-per-second: 4
      updates-per-second: 2
      deletes-per-second: 1
      replaces-per-second: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
