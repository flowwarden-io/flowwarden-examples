server:
  port: 0

spring:
  application:
    name: example-imperative-05-dlq
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-dlq
    rates:
      # 3 inserts/s — ~25% have total > 1500 and trip the DLQ flow.
      inserts-per-second: 3
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
