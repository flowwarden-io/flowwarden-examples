server:
  port: 0

spring:
  application:
    name: example-imperative-04-retry-policy
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-retry
    rates:
      # 2 inserts/s — totals are spread over [5, 2000] so ~25% have
      # total > 1500 and trigger the transient failure path.
      inserts-per-second: 2
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
