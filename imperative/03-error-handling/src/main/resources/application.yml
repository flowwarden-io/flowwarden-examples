server:
  port: 0

spring:
  application:
    name: example-imperative-03-error-handling
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-errors
    rates:
      inserts-per-second: 3
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0
    invalid-payload-ratio: 0.3    # ≈ 30% of inserts have status=null
                                  # and trigger IllegalArgumentException

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
