server:
  port: 0

spring:
  application:
    name: example-imperative-13-restart-policy
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-restart
    rates:
      inserts-per-second: 2
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0
  restart-demo:
    # The watched collection is dropped on this cadence. Each drop
    # invalidates the cursor and hands the stream to the restart loop.
    initial-delay-ms: 10000
    drop-interval-ms: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
    io.flowwarden.stream.internal.StreamRestarter: INFO
