server:
  port: 0

spring:
  application:
    name: example-imperative-07-pipeline
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/flowwarden-examples?replicaSet=rs0}

flowwarden:
  default-mode: imperative

examples:
  data-generator:
    enabled: true
    mode: imperative
    collection: orders-pipeline
    # Totals drawn uniformly from [5, 2000] in the generator, so ~50% of
    # inserts cross the THRESHOLD=1000 in PipelineHandler and reach the
    # handler. The other ~50% are dropped server-side, before the oplog
    # event even leaves MongoDB.
    rates:
      inserts-per-second: 4
      updates-per-second: 0
      deletes-per-second: 0
      replaces-per-second: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.flowwarden.examples: INFO
